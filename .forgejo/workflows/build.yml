name: Build glossary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install git
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git ca-certificates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate sources
        run: bun run test

      - name: Build
        run: bun run build
