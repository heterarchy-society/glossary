[collection]
name = "glossary"
schema = "term.json"
source_dir = "glossary"
format = "md"
output_key = "terms"
git_history = true

[glossary]
description = "A reference glossary for the parallel society."

[glossary.entry_style]
structure = """
Each entry has three paragraphs with distinct roles:
1. What it is — definition, origin of the term, core mechanism. Concise, no unnecessary context.
2. How it works — concrete examples, implementations, details. Where it manifests in practice.
3. Wider stakes — relation to the parallel society, implications, why it belongs in this glossary. Does not summarize but opens outward.
"""
tone = """
Written from the perspective of people actively building alternatives to centralized power.
States and corporations are implicitly adversaries; encryption, decentralization, and autonomy are tools of emancipation.
Factual and informative, not agitational. Facts speak for themselves.
Use wiki links liberally to connect related terms: [[term-id]] or [[term-id|display text]] (MediaWiki order: id left, label right).
"""

[languages]
default = "cs"

[languages.cs]
name = "Czech"

[translation]
# Bootstrap prompt: sets up the session context once.
# Subsequent terms use resume_prompt which is much shorter.
prompt = """
You are translating a glossary for the Heterarchy Society from English to {langName}.

Your job for each term I give you:
1. Translate the English "name" and "description" I provide into {langName}.
2. Write ONLY the translated result as JSON to the path I specify, with exactly two fields: "name" and "description".
3. Do not read any existing files.

Translation rules:
- Wiki links use MediaWiki [[target|display]] syntax: left is the English term id (never translated), right is the visible label (translate the right side only).
    [[cryptocurrency]] → [[cryptocurrency|kryptoměna]]
    [[smart contracts]] → [[smart contracts|chytré kontrakty]]
    [[encryption]] → [[encryption|šifrování]] or [[encryption|šifrovaný]] when adjective form fits
    [[censorship resistance]] → [[censorship resistance|obcházení cenzury]]
  For [[target|display]], keep the English id on the left; translate only the text after the pipe.
- Proper nouns and technical terms that don't change (Bitcoin, Tor, HTTPS, DDoS...) stay as-is.
- Preserve all markdown formatting.

Translate the following English term and write the {langName} result to translations/{lang}/{id}.json:

English name: {name}
English description:
{description}
"""

# Short prompt sent for each subsequent term in the same session.
resume_prompt = """
Translate the following English term and write the {langName} result to translations/{lang}/{id}.json:

English name: {name}
English description:
{description}
"""
