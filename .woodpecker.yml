when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  - name: build
    image: oven/bun:1
    commands:
      - bun install --frozen-lockfile
      - bun run test
      - bun run build

  - name: deploy
    image: appleboy/drone-scp
    when:
      - event: push
        branch: main
    depends_on: [build]
    settings:
      host: sftpgo.heterarchy.fyi
      port: 2222
      username: heterarchy
      key:
        from_secret: DEPLOY_SSH_KEY
      target: /public/glossary/
      source: dist/**
      strip_components: 1
      rm: true
