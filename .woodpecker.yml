# Validate, build dist/, deploy to SFTPGo over SSH (push to main only).
#
# Setup:
#   1. SFTPGo user (DEPLOY_USER) — SSH on DEPLOY_PORT, CI public key added
#   2. Woodpecker secret DEPLOY_SSH_KEY — private ed25519 key for that user
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  - name: test-and-build
    image: oven/bun:1
    commands:
      - bun install --frozen-lockfile
      - bun run test
      - bun run build

  - name: deploy
    image: alpine:3.20
    when:
      - event: push
        branch: main
    depends_on:
      - test-and-build
    environment:
      DEPLOY_HOST: sftpgo.heterarchy.fyi
      DEPLOY_PORT: "2222"
      DEPLOY_USER: heterarchy
      DEPLOY_SOURCE: dist/
      DEPLOY_TARGET: /public/glossary/
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
    commands:
      - apk add --no-cache rsync openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - rsync -avz --delete -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" "$DEPLOY_SOURCE" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_TARGET"
