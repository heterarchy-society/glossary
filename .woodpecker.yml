# Full git history required for atlas git_history.
# Cache: https://github.com/drone-plugins/drone-meltwater-cache (plugins/cache)
# Filesystem backend stores tarballs under /tmp/cache — bind-mount a host dir (repo must be trusted).
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  - name: restore-history-cache
    image: plugins/cache:1.10.7
    volumes:
      - /var/lib/woodpecker/atlas-history-cache:/tmp/cache
    settings:
      backend: filesystem
      restore: true
      cache_key: history-${CI_REPO_NAME}
      archive_format: gzip
      mount:
        - .atlas-cache/history

  - name: build
    image: oven/bun:1
    commands:
      - bun install --frozen-lockfile
      - bun run validate
      - bun run build

  - name: rebuild-history-cache
    image: plugins/cache:1.10.7
    volumes:
      - /var/lib/woodpecker/atlas-history-cache:/tmp/cache
    settings:
      backend: filesystem
      rebuild: true
      cache_key: history-${CI_REPO_NAME}
      archive_format: gzip
      mount:
        - .atlas-cache/history
    depends_on: [build]
    when:
      - event: push
        branch: main

  - name: deploy
    image: rclone/rclone:latest
    when:
      - event: push
        branch: main
    depends_on: [build]
    environment:
      DEPLOY_PASSWORD:
        from_secret: DEPLOY_SECRET
    commands:
      - rclone sync dist/ ":sftp,host=sftpgo.heterarchy.fyi,port=2222,user=heterarchy,pass=$DEPLOY_PASSWORD:/public/glossary" -v

  - name: trigger-website
    image: woodpeckerci/plugin-trigger
    when:
      - event: push
        branch: main
    depends_on: [deploy]
    settings:
      repositories:
        - heterarchy-society/heterarchy.fyi
      token:
        from_secret: WOODPECKER_TOKEN
